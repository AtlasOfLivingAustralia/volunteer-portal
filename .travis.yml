os: linux
dist: jammy
language: groovy
jdk:
  - openjdk11
branches:
  only:
  - master
  - develop
  - /^integration\/.*$/
  - /^feature\/.*$/
  - /^hotfix\/.*$/
services:
  - postgresql
addons:
  postgresql: "15"
  apt:
    sources:
      - sourceline: "deb http://apt.postgresql.org/pub/repos/apt jammy-pgdg main"
      - key_url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
    packages:
    - postgresql-15
    - postgresql-client-15
before_cache:
  - rm -f  $HOME/.gradle/caches/modules-2/modules-2.lock
  - rm -fr $HOME/.gradle/caches/*/plugin-resolution/
cache:
  directories:
  - $HOME/.m2
  - $HOME/.gradle/caches/
  - $HOME/.gradle/wrapper/
before_install:
  - sudo apt-get update
  - sudo cp travis/pg_hba.conf /etc/postgresql/15/main/pg_hba.conf 
  - sudo -u postgres sed -i -e 's/^port.*/port = 5432/' /etc/postgresql/15/main/postgresql.conf
  - sudo service postgresql@15-main restart
  - psql -c 'create database volunteerstest;' -U postgres
  - cp travis/travis.properties local.properties
  - echo "org.gradle.jvmargs=-Xmx3072m" >> ~/.gradle/gradle.properties
  - export GRAILS_ENV=test
  # import nexus cert
  - echo | openssl s_client -showcerts -servername nexus.ala.org.au -connect nexus.ala.org.au:443 2>/dev/null | sed -ne '/-BEGIN CERTIFICATE-/,/-END CERTIFICATE-/p' > nexus.crt
  #- sudo keytool -import -alias ala-nexus -keystore /usr/lib/jvm/java-11-openjdk-amd64/lib/security/cacerts -storepass changeit -noprompt -file nexus.crt
  - sudo keytool -import -alias ala-nexus -keystore /usr/local/lib/jvm/openjdk11/lib/security/cacerts -storepass changeit -noprompt -file nexus.crt
install:
  - travis_wait 30 ./gradlew assemble
after_success:
# - '[ "${TRAVIS_PULL_REQUEST}" = "false" ] && travis_retry ./gradlew publish'
  - '[ "${TRAVIS_PULL_REQUEST}" = "false" ] && GRAILS_ENV=production travis_retry ./gradlew publish'
#- '[ "${TRAVIS_BRANCH}" = "develop" ] && travis_retry curl -X POST --header "X-DEPLOY-KEY:
#  ${DEPLOY_KEY}" https://volunteer-dev.ala.org.au/deploy/${APP_VERSION}'
